name: Build Test

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # to replace the ccache entry
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_version: "11.8.0"
            cudnn_suffix: "cudnn8"
            ubuntu_version: "ubuntu22.04"
            cuda_arch: "arch=compute_35,code=sm_35 arch=compute_90,code=sm_90"

          - cuda_version: "12.6.3"
            cudnn_suffix: "cudnn"
            ubuntu_version: "ubuntu24.04"
            cuda_arch: "arch=compute_50,code=sm_50 arch=compute_90,code=sm_90"

          - cuda_version: "12.8.1"
            cudnn_suffix: "cudnn"
            ubuntu_version: "ubuntu24.04"
            cuda_arch: "arch=compute_50,code=sm_50 arch=compute_120,code=sm_120"

          # Disable CUDA 12.9.x it causes build error in CUDA macros
          # Ref. https://github.com/NVIDIA/cccl/issues/4967
          # - cuda_version: "12.9.1"
          #   cudnn_suffix: "cudnn"
          #   ubuntu_version: "ubuntu24.04"

          - cuda_version: "13.2.1"
            cudnn_suffix: "cudnn"
            ubuntu_version: "ubuntu24.04"
            cuda_arch: "arch=compute_75,code=sm_75 arch=compute_121,code=sm_121"

    container:
      image: nvidia/cuda:${{ matrix.cuda_version }}-${{ matrix.cudnn_suffix }}-devel-${{ matrix.ubuntu_version }}
    name: build (CUDA ${{ matrix.cuda_version }} / CUDNN ${{ matrix.cudnn_suffix }} / Ubuntu ${{ matrix.ubuntu_version }})

    steps:
      - name: Install system dependencies & Ruby
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -yq \
            curl \
            git \
            build-essential \
            libffi-dev \
            ruby-full \
            ruby-dev \
            ccache
          gem install bundler

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fix Git directory ownership
        run: git config --global --add safe.directory '*'

      # One entry per CUDA version, replaced on every push to master. A key
      # carrying the SHA never repeats, so every run saved a new entry rather
      # than refreshing one.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.cuda_version }}

      - name: Install Ruby dependencies
        run: bundle install

      - name: Compile Cumo (Build check)
        env:
          # Two architectures, the oldest and the newest the CUDA version
          # supports. Without this, mkmf-cu finds no nvidia-smi and builds every
          # architecture in its list, which is minutes of nvcc per job.
          CUMO_NVCC_GENERATE_CODE: ${{ matrix.cuda_arch }}
        run: |
          export CUDA_PATH=/usr/local/cuda
          export CPATH=/usr/local/cuda/include:${CPATH}
          export LIBRARY_PATH=/usr/local/cuda/lib64:${LIBRARY_PATH}

          mkdir -p /opt/ccache-bin
          ln -s /usr/bin/ccache /opt/ccache-bin/gcc
          ln -s /usr/bin/ccache /opt/ccache-bin/g++
          ln -s /usr/bin/ccache /opt/ccache-bin/nvcc
          export PATH=/opt/ccache-bin:$PATH

          export CCACHE_DIR=~/.cache/ccache
          export CCACHE_MAXSIZE=500M
          export CCACHE_CPP2=1
          ccache -z

          bundle exec rake compile
          bundle exec rake build_ctest

          ccache -s

      - name: Drop the ccache entry being replaced
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 204 replaced, 404 none yet; anything else and the save below is
          # refused, leaving the entry stale
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/caches?key=ccache-${{ matrix.cuda_version }}" || echo 000)
          echo "delete ccache-${{ matrix.cuda_version }} -> HTTP ${status}"

      - name: Save ccache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.cuda_version }}
